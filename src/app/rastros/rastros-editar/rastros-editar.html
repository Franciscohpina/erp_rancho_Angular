<h1>Editar Registro de Rastro</h1>

<div>
  <a class="btn btn-success btn-sm" [routerLink]="['/rastros']">Regresar</a>
</div>

<form (ngSubmit)="actualizarRastro()">
  <br>
  <div class="rastro-form">
    
    <div class="form-floating">
            <input [(ngModel)]="rastro.fecha" name="fecha" type="date" class="form-control" id="fecha">
      <label for="fecha">Fecha</label>
    </div>

    <div class="form-floating">
      <input [(ngModel)]="rastro.destino" name="destino" type="text" class="form-control" id="destino">
      <label for="destino">Destino</label>
    </div>

    <div class="form-floating">
      <select [(ngModel)]="rastro.estado" name="estado" class="form-select" id="estado">
        <option value="en proceso">En Proceso</option>
        <option value="finalizado">Finalizado</option>
        <option value="rechazado">Rechazado</option>
      </select>
      <label for="estado">Estado</label>
    </div>

    <div class="form-floating">
      <input [(ngModel)]="rastro.ganado_id" name="ganado_id" type="number" class="form-control" id="ganado_id">
      <label for="ganado_id">ID Ganado</label>
    </div>

    <div>
      <button type="submit">Actualizar Registro</button>
    </div>
  </div>    
</form>
