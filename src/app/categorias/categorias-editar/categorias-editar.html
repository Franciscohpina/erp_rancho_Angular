<h1>Editar Categoría</h1>

<div>
  <a class="btn btn-success btn-sm" [routerLink]="['/categorias']">Regresar</a>
</div>

<form (ngSubmit)="actualizarCategoria()">
  <br>
  <div class="categoria-form">
    <div class="form-floating">
            <input [(ngModel)]="categoria.nombre" name="nombre" type="text" class="form-control" id="nombre">
      <label for="nombre">Nombre</label>
    </div>
    <div class="form-floating">
      <input [(ngModel)]="categoria.descripcion" name="descripcion" type="text" class="form-control" id="descripcion">
      <label for="descripcion">Descripción</label>
    </div>
    <div>
      <button type="submit">Actualizar Categoría</button>
    </div>
  </div>    
</form>
