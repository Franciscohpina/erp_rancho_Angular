<h1>Categorias</h1>

<div>
<a class="btn btn-success btn-sm" [routerLink]="['/categorias/crear']" href=""> Agregar categoria </a>
</div>

<br>
<table class="administradores-listar table-striped">
  <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Nombre</th>
      <th scope="col">Descripcion</th>
      <th width="250px">Acciones</th>

    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let categorias of categorias">
      <th scope="row">{{ categorias.id }}</th>
      <td>{{categorias.nombre}}</td>   
      <td>{{categorias.descripcion}}</td>
       <td>
        <button class="btn btn-warning btn-sm m-1">Detalles</button>
        <a [routerLink]="['/categorias',categorias.id, 'editar']"class="btn btn-primary btn-sm m-1">Editar</a>
        <button class="btn btn-danger btn-sm">Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>
