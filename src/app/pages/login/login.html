<br>
<div class="main-content">

<div class="login-container">
  <h2>Iniciar Sesión</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
  <label for="username">Usuario:</label>
  <input 
    id="username" 
    type="text" 
    formControlName="username" 
    placeholder="Tu nombre de usuario"
    [class.invalid]="username?.invalid && username?.touched">
  
  <div *ngIf="username?.invalid && (username?.dirty || username?.touched)" class="error-message">
    <span *ngIf="username?.errors?.['required']">El nombre de usuario es requerido.</span>
  </div>
</div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input 
        id="password" 
        type="password" 
        formControlName="password"
        [class.invalid]="password?.invalid && password?.touched">
      
      <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="error-message">
        <span *ngIf="password?.errors?.['required']">La contraseña es requerida.</span>
        <span *ngIf="password?.errors?.['minlength']">Debe tener al menos 6 caracteres.</span>
      </div>
    </div>

    <div *ngIf="loginError" class="error-message general-error">
      {{ loginError }}
    </div>

    <button type="submit" [disabled]="loginForm.invalid">
      Entrar
    </button>
  </form>
</div>
</div>
