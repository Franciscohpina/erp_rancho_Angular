<h1>Crea un nuevo ganado</h1>

<div class="ganado-form">
    <div class="form-floating mb-3">
    <input type="text" class="form-control" id="proveedor">
    <label for="proveedor">Proveedor</label>
    </div>
    <div class="form-floating mb-3">
    <input type="text" class="form-control" id="edad">
    <label for="edad">Edad</label>
    </div>
    <div class="form-floating">
    <input type="text" class="form-control" id="nss">
    <label for="nss">Numero de seguro social</label>
    </div>
    <div class="form-floating mb-3">
    <input type="email" class="form-control" id="Sexo">
    <label for="sexo">Sexo</label>
    </div>
    <div class="form-floating">
    <input type="text" class="form-control" id="peso">
    <label for="peso">Peso</label>
    </div>
    <div class="form-floating mb-3">
    <input type="text" class="form-control" id="precio">
    <label for="precio">Precio</label>
    </div>
    <div class="form-floating">
    <input type="text" class="form-control" id="origen">
    <label for="origen">Origen</label>
    </div>
    <div class="form-floating">
    <input type="text" class="form-control" id="altura">
    <label for="altura">Altura</label>
    </div>
    <div class="input-group mb-3">
    <input type="file" class="form-control" id="inputGroupFile02">
    <label class="input-group-text" for="inputGroupFile02">Imagen</label>
    </div>
    <select class="form-select" aria-label="select-estado">
    <option selected>Selecciona un rol </option>
    <option value="activo">Activo</option>
    <option value="inactivo">Inactivo</option>
    </select>
    <div class="form-floating mb-3">
    <input type="text" class="form-control" id="raza">
    <label for="raza">Raza</label>
    </div>
    <div class="form-floating mb-3">
    <input type="text" class="form-control" id="categoria">
    <label for="categoria">Categoria</label>
    </div>
    <div class="form-floating mb-3">
    <input type="text" class="form-control" id="corral">
    <label for="corral">Corral</label>
    </div>
</div>
