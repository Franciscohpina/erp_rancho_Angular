<h1>Crea un nuevo ganado</h1>

<div>
<a class="btn btn-success btn-sm" [routerLink]="['/ganados']"  href=""> regresar </a>
</div>
<br>
<form (ngSubmit)="crearGanados()">
    <div class="ganado-form">
        <div class="form-floating mb-3">
        <input [(ngModel)]="ganados.edad" name="edad" type="number" class="form-control" id="edad">
        <label for="edad">Edad</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="ganados.sexo" name="sexo" type="email" class="form-control" id="Sexo">
        <label for="sexo">Sexo</label>
        </div>
        <div class="form-floating">
        <input [(ngModel)]="ganados.peso" name="peso" type="number" class="form-control" id="peso">
        <label for="peso">Peso</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="ganados.precio" name="precio" type="number" class="form-control" id="precio">
        <label for="precio">Precio</label>
        </div>
        <div class="form-floating">
        <input [(ngModel)]="ganados.origen" name="origen" type="text" class="form-control" id="origen">
        <label for="origen">Origen</label>
        </div>
        <div class="form-floating">
        <input [(ngModel)]="ganados.altura" name="altura" type="number" class="form-control" id="altura">
        <label for="altura">Altura</label>
        </div>
        <div class="input-group mb-3">
        <input [(ngModel)]="ganados.imagen" name="imagen" type="file" class="form-control" id="inputGroupFile02">
        <label class="input-group-text" for="inputGroupFile02">Imagen</label>
        </div>
        <select [(ngModel)]="ganados.estado" name="estado" class="form-select" aria-label="select-estado">
        <option selected>Selecciona un estado </option>
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
        </select>
        <div class="form-floating mb-3">
        <input [(ngModel)]="ganados.raza_id" name="raza_id" type="number" class="form-control" id="raza_id">
        <label for="raza_id">Raza</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="ganados.categoria_id" name="categoria_id" type="number" class="form-control" id="categoria_id">
        <label for="categoria_id">Categoria</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="ganados.corral_id" name="corral_id" type="number" class="form-control" id="corral_id">
        <label for="corral_id">Corral</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="ganados.proveedor_id" name="proveedor_id" type="number" class="form-control" id="proveedor_id">
        <label for="proveedor_id">Proveedor</label>
        </div>
        <div>
           <button type="submit">Guardar Ganado</button>
           <button type="reset">Limpiar Registro</button>        
       </div>
    </div>
</form>
