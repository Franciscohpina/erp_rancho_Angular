<h1>Editar Registro de proveedor</h1>

<div>
<a class="btn btn-success btn-sm" [routerLink]="['/proveedores']" href=""> Regresar </a>
</div>
<br>
<form (ngSubmit)="actualizarProveedor()">

    <div class="proveedores-form">
        <div class="form-floating mb-3">
        <input [(ngModel)]="proveedor.nombre" name="nombre" type="text" class="form-control" id="nombre">
        <label for="nombre">Nombre</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="proveedor.direccion" name="direccion" type="text" class="form-control" id="direccion">
        <label for="direccion">Direccion</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="proveedor.correo" name="correo" type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
        <label for="floatingInput">Correo</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="proveedor.telefono" name="telefono" type="text" class="form-control" id="telefono" >
        <label for="telefono">Telefono</label>
        </div>
        <div class="form-floating">
        <input [(ngModel)]="proveedor.categoria" name="categoria" type="text" class="form-control" id="categoria">
        <label for="categoria">Categoria</label>
        </div>
        <select [(ngModel)]="proveedor.estado" name="estado" class="form-select" aria-label="select-estado">
        <option selected>Selecciona el estado </option>
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
        </select>
        <div>
        <button type="submit">Actualizar Registro</button>
        </div>
        </div>    

</form>
