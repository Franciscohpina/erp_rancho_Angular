<h1>Registra un nuevo proveedor</h1>

<div>
<a class="btn btn-success btn-sm" [routerLink]="['/proveedores']" href=""> Regresar </a>
</div>
<br>
<form (ngSubmit)="crearCliente()">

    <div class="proveedores-form">
        <div class="form-floating mb-3">
        <input [(ngModel)]="proveedores.nombre" name="nombre" type="text" class="form-control" id="nombre">
        <label for="nombre">Nombre</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="proveedores.direccion" name="direccion" type="text" class="form-control" id="direccion">
        <label for="direccion">Direccion</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="proveedores.correo" name="correo" type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
        <label for="floatingInput">Correo</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="proveedores.telefono" name="telefono" type="text" class="form-control" id="telefono" >
        <label for="telefono">Telefono</label>
        </div>
        <div class="form-floating">
        <input [(ngModel)]="proveedores.categoria" name="categoria" type="text" class="form-control" id="categoria">
        <label for="categoria">Categoria</label>
        </div>
        <select [(ngModel)]="proveedores.estado" name="estado" class="form-select" aria-label="select-estado">
        <option selected>Selecciona el estado </option>
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
        </select>
        <div>
           <button type="submit">Guardar Proveedor</button>
           <button type="reset">Limpiar Registro</button>        
       </div>
    </div>
</form>
