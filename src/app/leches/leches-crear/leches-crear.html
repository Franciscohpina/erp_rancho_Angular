<h1>Registra una nueva ordeña</h1>

<div>
<a class="btn btn-success btn-sm" [routerLink]="['/leches']" href=""> Regresar </a>
</div>

<br>

<form (ngSubmit)="crearLeches()">

    <div class="leches-form">
        <div class="form-floating mb-3">
        <input [(ngModel)]="leches.fecha" name="fecha" type="string" class="form-control" id="fecha">
        <label for="fecha">Fecha</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="leches.cantidad" name="cantidad" type="number" class="form-control" id="cantidad">
        <label for="cantidad">Cantidad</label>
        </div>
        <div class="form-floating">
        <input [(ngModel)]="leches.densidad" name="densidad" type="number" class="form-control" id="densidad">
        <label for="densidad">Densidad</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="leches.tanque_id" name="tanque_id" type="number" class="form-control" id="tanque_id" >
        <label for="tanque_id">Tanque_id</label>
        </div>
        <div class="form-floating">
        <input [(ngModel)]="leches.ganado_id" name="ganado_id" type="number" class="form-control" id="ganado_id">
        <label for="ganado_id">Ganado_id</label>
        </div>
        <div>
           <button type="submit">Guardar Leche</button>
           <button type="reset">Limpiar Registro</button>        
       </div>
    </div>    
</form>
