<h1>Editar raza</h1>

<div>
<a class="btn btn-success btn-sm" [routerLink]="['/razas']" href=""> Regresar </a>
</div>

<br>
<form (ngSubmit)="actualizarRaza()">
    <div class="razas-form">
        <div class="form-floating mb-3">
        <input [(ngModel)]="raza.nombre" name="nombre" type="text" class="form-control" id="nombre">
        <label for="nombre">Nombre</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="raza.origen" name="origen" type="text" class="form-control" id="origen">
        <label for="origen">Origen</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="raza.descripcion" name="descripcion" type="text" class="form-control" id="descripcion" >
        <label for="descripcion">Descripcion</label>
        </div>
        <select [(ngModel)]="raza.estado" name="estado" class="form-select" aria-label="select-estado">
        <option selected>Selecciona el estado </option>
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
        </select>
        <div>
        <button type="submit">Actualizar Registro</button>
        </div>
        </div>    
</form>
