<h1>Registra un nuevo proveedor</h1>

<form (ngSubmit)="crearRazas()">
    <div class="razas-form">
        <div class="form-floating mb-3">
        <input [(ngModel)]="razas.nombre" name="nombre" type="text" class="form-control" id="nombre">
        <label for="nombre">Nombre</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="razas.origen" name="origen" type="text" class="form-control" id="origen">
        <label for="origen">Origen</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="razas.descripcion" name="descripcion" type="text" class="form-control" id="descripcion" >
        <label for="descripcion">Descripcion</label>
        </div>
        <select [(ngModel)]="razas.estado" name="estado" class="form-select" aria-label="select-estado">
        <option selected>Selecciona el estado </option>
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
        </select>
        <div>
           <button type="submit">Guardar Raza</button>
           <button type="reset">Limpiar Registro</button>        
       </div>
    </div>
</form>
