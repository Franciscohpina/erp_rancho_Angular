<h1>Crea un nuevo cliente</h1>

<form (ngSubmit)="crearCliente()">

    <div class="cliente-form">
        <div class="form-floating mb-3">
        <input [(ngModel)]="cliente.nombre" name="nombre" type="text" class="form-control" id="nombre">
        <label for="nombre">Nombre</label>
        </div>
        <div class="form-floating">
        <input [(ngModel)]="cliente.direccion" name="direccion" type="text" class="form-control" id="direccion">
        <label for="direccion">Direccion</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="cliente.correo" name="correo" type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
        <label for="floatingInput">Correo</label>
        </div>
        <div class="form-floating">
        <input [(ngModel)]="cliente.telefono" name="telefono" type="text" class="form-control" id="telefono">
        <label for="telefono">Telefono</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="cliente.rfc" name="rfc" type="text" class="form-control" id="rfc">
        <label for="rfc">RFC</label>
        </div>
        <select [(ngModel)]="cliente.estado" name="estado" class="form-select" aria-label="select-estado">
        <option selected>Selecciona un estado </option>
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
        </select>
        <div>
           <button type="submit">Guardar Cliente</button>
           <button type="reset">Limpiar Registro</button>        
       </div>
    </div>

</form>
