<h1>Crea un nuevo cliente</h1>

<form (ngSubmit)="crearCliente()">

    <div class="cliente-form">
        <div class="form-floating mb-3">
        <input [(ngModel)]="cliente.id" type="text" class="form-control" id="id">
        <label for="id">ID</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="cliente.nombre" type="text" class="form-control" id="nombre">
        <label for="nombre">Nombre</label>
        </div>
        <div class="form-floating">
        <input [(ngModel)]="cliente.direccion" type="text" class="form-control" id="direccion">
        <label for="direccion">Direccion</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="cliente.correo" type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
        <label for="floatingInput">Correo</label>
        </div>
        <div class="form-floating">
        <input [(ngModel)]="cliente.telefono" type="text" class="form-control" id="telefono">
        <label for="telefono">Telefono</label>
        </div>
        <div class="form-floating mb-3">
        <input [(ngModel)]="cliente.rfc" type="text" class="form-control" id="rfc">
        <label for="rfc">RFC</label>
        </div>
        <div class="form-floating">
        <input [(ngModel)]="cliente.csf" type="text" class="form-control" id="csf" placeholder="Password">
        <label for="csf">CSF</label>
        </div>
        
        <select [(ngModel)]="cliente.estado" class="form-select" aria-label="select-estado">
        <option selected>Selecciona un estado </option>
        <option value="activo">Activo</option>
        <option value="inactivo">Inactivo</option>
        </select>
    </div>

</form>
