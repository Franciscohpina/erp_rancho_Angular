<h1>Clientes</h1>

<div>
<a class="btn btn-success btn-sm" [routerLink]="['/cliente/crear']" href=""> Agregar cliente </a>
</div>

<br>
<table class="administradores-listar table-striped">
  <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Nombre</th>
      <th scope="col">Direccion</th>
      <th scope="col">Telefono</th>
      <th scope="col">Correo</th>
      <th scope="col">RFC</th>
      <th scope="col">Estado</th>
      <th width="250px">Acciones</th>
    </tr>
  </thead>
 <tbody>
    <tr *ngFor="let cliente of clientes">
      <th scope="row">{{ cliente.id }}</th>
      <td>{{cliente.nombre}}</td>   
      <td>{{cliente.direccion}}</td>
      <td>{{cliente.telefono}}</td>
      <td>{{cliente.correo}}</td>
      <td>{{cliente.rfc}}</td>
      <td>{{cliente.estado}}</td>
      <td class="text-nowrap">
          <a [routerLink]="['/cliente', cliente.id]" class="btn btn-warning btn-sm m-1">Detalles</a>
          <a [routerLink]="['/cliente',cliente.id,'editar']"class="btn btn-primary btn-sm m-1">Editar</a>
          <button (click)="eliminarCliente(cliente.id)" class="btn btn-danger btn-sm">Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>
