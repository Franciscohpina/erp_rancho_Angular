<h1>Editar Cliente</h1>

<div>
  <a class="btn btn-success btn-sm" [routerLink]="['/cliente']">Regresar</a>
</div>

<form (ngSubmit)="actualizarCliente()">
  <br>
  <div class="cliente-form">
    <div class="form-floating">
      <input [(ngModel)]="cliente.nombre" name="nombre" type="text" class="form-control" id="nombre">
      <label for="nombre">Nombre</label>
    </div>
    <div class="form-floating">
      <input [(ngModel)]="cliente.direccion" name="direccion" type="text" class="form-control" id="direccion">
      <label for="direccion">Dirección</label>
    </div>
    <div class="form-floating">
      <input [(ngModel)]="cliente.telefono" name="telefono" type="text" class="form-control" id="telefono">
      <label for="telefono">Teléfono</label>
    </div>
    <div class="form-floating">
      <input [(ngModel)]="cliente.correo" name="correo" type="email" class="form-control" id="correo">
      <label for="correo">Correo</label>
    </div>
    <div class="form-floating">
      <input [(ngModel)]="cliente.rfc" name="rfc" type="text" class="form-control" id="rfc">
      <label for="rfc">RFC</label>
    </div>
    <div class="form-floating">
      <select [(ngModel)]="cliente.estado" name="estado" class="form-select" id="estado">
        <option value="Activo">Activo</option>
        <option value="Inactivo">Inactivo</option>
      </select>
      <label for="estado">Estado</label>
    </div>
    <div>
      <button type="submit">Actualizar Cliente</button>
    </div>
  </div>    
</form>
