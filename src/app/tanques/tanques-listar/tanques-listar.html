
<a class="btn btn-success btn-sm" [routerLink]="['/tanques/crear']" href=""> Registrar un nuevo tanque </a>

<br>
<br>
  <table class="tanques-listar">
  <thead>
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Capacidad</th>
      <th scope="col">Temperatura</th>
      <th scope="col">Estado</th>
      <th scope="col">Leche_id</th>
      <th width="250px">Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let tanques of tanques">
      <th scope="row">{{ tanques.id }}</th>
      <td>{{tanques.capacidad}}</td>   
      <td>{{tanques.temperatura}}</td>
      <td>{{tanques.estado}}</td>
      <td>{{tanques.leche_id}}</td>
       <td class="text-nowrap">
        <div class="btn-group" role="group">
          <a [routerLink]="['/tanques', tanques.id]" class="btn btn-warning btn-sm">Detalles</a>
          <a [routerLink]="['/tanques', tanques.id, 'editar']" class="btn btn-primary btn-sm">Editar</a>
          <button (click)="eliminarTanque(tanques.id)" class="btn btn-danger btn-sm">Eliminar</button>
        </div>
      </td>
    </tr>
  </tbody>
</table>
