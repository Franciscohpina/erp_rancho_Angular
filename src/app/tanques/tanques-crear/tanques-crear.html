<h1>Registra un nuevo tanque</h1>

<div class="main-content">
    <div class="tanques-form">
        <div class="form-floating mb-3">
        <input type="text" class="form-control" id="id">
        <label for="id">ID</label>
        </div>
        <div class="form-floating mb-3">
        <input type="text" class="form-control" id="capacidad">
        <label for="capacidad">Capacidad</label>
        </div>
        <div class="form-floating mb-3">
        <input type="text" class="form-control" id="temperatura">
        <label for="temperatura">Temperatura</label>
        </div>
        <div class="form-floating mb-3">
        <input type="text" class="form-control" id="leche_id">
        <label for="leche_id">Leche_id</label>
        </div>
        <select class="form-select" aria-label="select-estado">
        <option selected>Selecciona el estado </option>
        <option value="vacio">Vacio</option>
        <option value="lleno">Lleno</option>
        </select>
    </div>
</div>
