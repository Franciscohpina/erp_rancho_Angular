<h1>Crea un nuevo administrador</h1>

<div>
<a class="btn btn-success btn-sm" [routerLink]="['/administradores']"> regresar </a>
</div>

<form (ngSubmit)="crearAdministradores()">
<br>
 <div class="administrador-form">
<div class="form-floating">
<input [(ngModel)]="administradores.nombres" name="nombres" type="text" class="form-control" id="nombre" required>
<label for="nombre">Nombres</label>
 </div>
 <div class="form-floating">
<input [(ngModel)]="administradores.apellidos" name="apellidos" type="text" class="form-control" id="apellidos" required>
  <label for="apellidos">Apellidos</label>
  </div>
<div class="form-floating">
<input [(ngModel)]="administradores.nss" name="nss" type="text" class="form-control" id="nss" required>
  <label for="nss">Numero de seguro social</label>
  </div>
  <div class="form-floating">
<input [(ngModel)]="administradores.email" name="email" type="email" class="form-control" id="floatingInput" placeholder="name@example.com" required>
  <label for="floatingInput">Correo</label>
</div>
  <div class="form-floating">
<input [(ngModel)]="administradores.telefono" name="telefono" type="text" class="form-control" id="telefono" required>
  <label for="telefono">Telefono</label>
  </div>
  <div class="form-floating mb-3">
<input [(ngModel)]="administradores.rfc" name="rfc" type="text" class="form-control" id="rfc" required>
  <label for="rfc">RFC</label>
 </div>
  <div class="form-floating">
<input [(ngModel)]="administradores.username" name="username" type="text" class="form-control" id="csf" placeholder="usuario" required>
  <label for="usuario">Usuario</label>
  </div>
  <div class="form-floating">
<input [(ngModel)]="administradores.password" name="password" type="password" class="form-control" id="floatingPassword" placeholder="Password" required>
 <label for="floatingPassword">Contraseña</label>
 </div>

 <!-- CAMBIO: 'imagen' ya no usa ngModel, usa (change) -->
 <div class="input-group mb-3">
<input (change)="onFileSelected($event)" name="imagen" type="file" class="form-control" id="inputGroupFile02" required>
 <label class="input-group-text" for="inputGroupFile02">Imagen</label>
 </div>

 <!-- CAMBIO: 'rol' ahora es requerido y tiene una opción deshabilitada -->
<select [(ngModel)]="administradores.rol" name="rol" class="form-select" aria-label="select-estado" required>
 <option value="" disabled>Selecciona un rol</option>
 <option value="admin">Administrador</option>
 <option value="superAdmin">SuperAdministrador</option>
 </select>
 <div>
<button type="submit">Guardar Administrador</button>
<button type="reset">Limpiar Administrador</button> 
       </div>
 </div>
</form>
