<h1>Crea un nuevo administrador</h1>

<div class="administrador-form">
    <div class="form-floating mb-3">
    <input type="text" class="form-control" id="id">
    <label for="id">ID</label>
    </div>
    <div class="form-floating mb-3">
    <input type="text" class="form-control" id="nombre">
    <label for="nombre">Nombres</label>
    </div>
    <div class="form-floating mb-3">
    <input type="text" class="form-control" id="apellidos">
    <label for="apellidos">Apellidos</label>
    </div>
    <div class="form-floating">
    <input type="text" class="form-control" id="nss">
    <label for="nss">Numero de seguro social</label>
    </div>
    <div class="form-floating mb-3">
    <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
    <label for="floatingInput">Correo</label>
    </div>
    <div class="form-floating">
    <input type="text" class="form-control" id="telefono">
    <label for="telefono">Telefono</label>
    </div>
    <div class="form-floating mb-3">
    <input type="text" class="form-control" id="rfc">
    <label for="rfc">RFC</label>
    </div>
    <div class="form-floating">
    <input type="text" class="form-control" id="csf" placeholder="usuario">
    <label for="usuario">Usuario</label>
    </div>
    <div class="form-floating">
    <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
    <label for="floatingPassword">Contreseña</label>
    </div>
    <div class="input-group mb-3">
    <input type="file" class="form-control" id="inputGroupFile02">
    <label class="input-group-text" for="inputGroupFile02">Imagen</label>
    </div>
    <select class="form-select" aria-label="select-estado">
    <option selected>Selecciona un rol </option>
    <option value="admin">Administrador</option>
    <option value="superadmin">Superadministrador</option>
    </select>
</div>
